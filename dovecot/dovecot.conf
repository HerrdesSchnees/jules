# Dovecot configuration for simulation
protocols = imap
listen = *
disable_plaintext_auth = no
ssl = no

passdb {
  driver = static
  args = password=testpass
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

mail_location = maildir:/var/mail/%u/Maildir

service imap-login {
  inet_listener imap {
    port = 143
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
