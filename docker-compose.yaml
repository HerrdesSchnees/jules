version: "3.8"

services:
  rspamd:
    image: rspamd/rspamd:latest
    container_name: jules-rspamd
    ports:
      - "11334:11334"
      - "11333:11333"
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    networks:
      - jules-net
    restart: unless-stopped

  dovecot:
    image: dovecot/dovecot:latest
    container_name: jules-dovecot
    volumes:
      - ./dovecot/conf.d:/etc/dovecot/conf.d:ro
      - ./testdata/mail:/var/mail/vagrant:ro
      - dovecot-data:/var/mail
    networks:
      - jules-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: jules-worker
    env_file:
      - .env
    environment:
      JULES_MODE: ${JULES_MODE:-simulation}
      IMAP_SERVER: ${IMAP_SERVER:-jules-dovecot}
      IMAP_PORT: ${IMAP_PORT:-143}
      IMAP_USER: ${IMAP_USER:-vagrant}
      IMAP_PASS: ${IMAP_PASS:-vagrant}
      IMAP_SSL: ${IMAP_SSL:-false}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      JUNK_MAILBOX: ${JUNK_MAILBOX:-Junk}
      RSPAMD_URL: ${RSPAMD_URL:-http://jules-rspamd:11334}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DRY_RUN: ${DRY_RUN:-true}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-300}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./testdata:/app/testdata:ro
    networks:
      - jules-net
    depends_on:
      - rspamd
      - dovecot
    restart: unless-stopped

networks:
  jules-net:
    driver: bridge

volumes:
  rspamd-data:
  dovecot-data:
