name: jules-imap-worker

services:
  rspamd:
    image: rspamd/rspamd:latest
    container_name: jules-rspamd
    ports:
      - "11334:11334"
      - "11333:11333"
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    networks:
      - jules-net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: jules-worker
    env_file:
      - .env
    environment:
      JULES_MODE: ${JULES_MODE:-real}
      IMAP_SERVER: ${IMAP_SERVER:-imap.a1.net}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_SSL: ${IMAP_SSL:-true}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      JUNK_MAILBOX: ${JUNK_MAILBOX:-Junk}
      RSPAMD_URL: ${RSPAMD_URL:-http://jules-rspamd:11334}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DRY_RUN: ${DRY_RUN:-true}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-300}
    volumes:
      - /mnt/user/appdata/jules-imap-worker/logs:/app/logs
      - /mnt/user/appdata/jules-imap-worker/state:/app/state
    networks:
      - jules-net
    depends_on:
      - rspamd
    restart: unless-stopped

networks:
  jules-net:
    driver: bridge

volumes:
  rspamd-data:
